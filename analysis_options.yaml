# Shared analysis configuration for every package in the workspace.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - directives_ordering
    - prefer_final_locals
    - prefer_relative_imports
    - unawaited_futures
