name: witch_doctor
description: >-
  Simple, type-safe dependency injection for Dart. Scoped containers,
  singleton/factory/lazy lifetimes, and optional annotation-based auto-wiring.
version: 2.0.0
repository: https://github.com/CenturyBoys/witch-doctor-dart
homepage: https://github.com/CenturyBoys/witch-doctor-dart
issue_tracker: https://github.com/CenturyBoys/witch-doctor-dart/issues
topics:
  - dependency-injection
  - di
  - ioc
  - service-locator

environment:
  sdk: ^3.10.3

# The runtime library has ZERO production dependencies. Code generation lives
# in the separate `witch_doctor_generator` dev dependency.
resolution: workspace

dev_dependencies:
  lints: ^6.1.0
  test: ^1.29.0
