name: witch_doctor_generator
description: >-
  Build-time code generator for witch_doctor. Turns @Remedy annotations into
  type-safe dependency registrations. Use it as a dev dependency.
version: 2.0.0
repository: https://github.com/CenturyBoys/witch-doctor-dart
homepage: https://github.com/CenturyBoys/witch-doctor-dart
issue_tracker: https://github.com/CenturyBoys/witch-doctor-dart/issues
topics:
  - dependency-injection
  - codegen
  - build-runner
  - source-gen

environment:
  sdk: ^3.10.3

resolution: workspace

dependencies:
  analyzer: ">=7.0.0 <10.0.0"
  build: ">=2.4.0 <6.0.0"
  dart_style: ^3.0.0
  glob: ^2.1.0
  source_gen: ">=2.0.0 <5.0.0"
  witch_doctor: ^2.0.0

dev_dependencies:
  build_runner: ^2.11.0
  lints: ^6.1.0
  test: ^1.29.0
