repos:
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format .
        language: system
        types: [dart]
        pass_filenames: false
        always_run: true

      - id: dart-analyze
        name: dart analyze
        entry: dart analyze
        language: system
        types: [dart]
        pass_filenames: false
        always_run: true

      - id: conventional-commit
        name: conventional commit message
        language: pygrep
        entry: '^(?!(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+)'
        args: [--multiline]
        stages: [commit-msg]
