name: Feature request
description: Suggest an idea for witch_doctor
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Show the API you'd want.
      render: dart
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
